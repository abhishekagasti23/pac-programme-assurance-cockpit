name: PAC CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate imports
        run: |
          python -c "from data_fusion import run_medallion, SILVER_SCHEMA; print('data_fusion OK')"
          python -c "from health_engine import GateReadinessModel, portfolio_summary; print('health_engine OK')"
          python -c "from narrative_engine import generate_exception_report; print('narrative_engine OK')"
          python -c "from demo_data import generate_demo_portfolio; print('demo_data OK')"

      - name: Smoke test pipeline
        run: |
          python - << 'PYEOF'
          from datetime import datetime
          from data_fusion import run_medallion
          from health_engine import GateReadinessModel, portfolio_summary
          from demo_data import generate_demo_portfolio

          raw = generate_demo_portfolio()
          _, silver, gold = run_medallion(raw, data_date=datetime(2025, 1, 15))

          gm = GateReadinessModel()
          gm.train()
          gold["gate_pass_probability"] = gm.predict(gold)

          ps = portfolio_summary(gold)
          print(f"Pipeline OK — {ps['total_projects']} projects | RED {ps['red_count']} | AMBER {ps['amber_count']} | GREEN {ps['green_count']}")
          print(f"AUC: {gm.auc:.3f} | Budget: {ps['total_budget_bn']:.2f}bn | EAC: {ps['total_eac_bn']:.2f}bn")
          PYEOF
