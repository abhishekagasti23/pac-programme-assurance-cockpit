name: Publish PAC from Local

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: self-hosted   # runs on YOUR machine

    steps:
      - name: Configure git
        run: |
          git config --global user.name "abhishekagasti23"
          git config --global user.email "abhishekagasti23@users.noreply.github.com"

      - name: Initialise and push PAC folder
        run: |
          cd "E:\Data Science New Projects\Kpmg Project\Programme Assurance Cockpit"

          git init
          git checkout -b main

          # Write .gitignore
          echo "__pycache__/" > .gitignore
          echo "*.pyc" >> .gitignore
          echo ".env" >> .gitignore
          echo "venv/" >> .gitignore
          echo ".DS_Store" >> .gitignore

          git add -A
          git commit -m "Initial commit: PAC Programme Assurance Cockpit v1.0"

          git remote remove origin 2>nul || true
          git remote add origin https://abhishekagasti23:${{ secrets.GH_PAT }}@github.com/abhishekagasti23/pac-programme-assurance-cockpit.git

          git push -u origin main --force

          echo "Published: https://github.com/abhishekagasti23/pac-programme-assurance-cockpit"
        shell: cmd
